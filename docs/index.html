    body { background: var(--surface-0); color: var(--text-primary); }
    .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; }
    .muted { color: var(--text-muted); }
    .secondary { color: var(--text-secondary); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo } = React;

    const fmt = (v, d = 1) => (v === null || v === undefined || Number.isNaN(v) ? "–" : Number(v).toFixed(d));
    const mean = (xs) => (xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null);

    /* ---------- small pieces ---------- */

    function Stat({ label, value, unit, hint }) {
      return (
        <div className="card p-4">
          <div className="text-xs uppercase tracking-wide muted">{label}</div>
          <div className="mt-1 text-3xl font-semibold num">{value}<span className="text-lg secondary ml-0.5">{unit}</span></div>
          {hint && <div className="mt-1 text-xs secondary">{hint}</div>}
        </div>
      );
    }

    function Legend({ items }) {
      return (
        <div className="flex flex-wrap gap-4 text-xs secondary">
          {items.map(([label, color]) => (
            <span key={label} className="inline-flex items-center gap-1.5">
              <span className="inline-block w-3 h-3 rounded-sm" style={{ background: color }}></span>{label}
            </span>
          ))}
        </div>
      );
    }

    function Tooltip({ tip }) {
      if (!tip) return null;
      return (
        <div className="pointer-events-none absolute z-10 card px-3 py-2 text-xs shadow-lg"
             style={{ left: tip.x, top: tip.y, transform: "translate(-50%, calc(-100% - 10px))", minWidth: 150 }}>
          <div className="font-medium mb-1">{tip.title}</div>
          {tip.rows.map(([k, v, c]) => (
            <div key={k} className="flex justify-between gap-4">
              <span className="inline-flex items-center gap-1.5 secondary">
                {c && <span className="inline-block w-2 h-2 rounded-sm" style={{ background: c }}></span>}{k}
              </span>
              <span className="num">{v}</span>
            </div>
          ))}
        </div>
      );
    }

    /* ---------- chart: prompt tokens vs cached tokens per step ---------- */

    function StepTokensChart({ steps }) {
      const [tip, setTip] = useState(null);
      const wrap = useRef(null);
      if (!steps || !steps.length) return <div className="text-sm muted">No steps yet.</div>;
      const W = 640, H = 240, m = { t: 12, r: 8, b: 30, l: 48 };
      const maxY = Math.max(...steps.map((s) => s.prompt_tokens || 0), 1);
      const niceMax = Math.ceil(maxY / 500) * 500;
      const iw = W - m.l - m.r, ih = H - m.t - m.b;
      const band = iw / steps.length, bw = Math.min(22, (band - 10) / 2);
      const y = (v) => m.t + ih - (v / niceMax) * ih;
      const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => Math.round(niceMax * f));
      const show = (e, s) => {
        const r = wrap.current.getBoundingClientRect();
        setTip({
          x: e.clientX - r.left, y: e.clientY - r.top, title: `Step ${s.index}${s.tool ? ` · ${s.tool}` : " · final answer"}`,
          rows: [
            ["Prompt tokens", s.prompt_tokens ?? "–", "var(--series-1)"],
            ["Cached tokens", s.cached_tokens ?? "–", "var(--series-2)"],
            ["Cache hit", s.prompt_tokens && s.cached_tokens != null ? `${Math.round((100 * s.cached_tokens) / s.prompt_tokens)}%` : "–"],
            ["TTFT", `${fmt(s.llm_ttft_s, 2)} s`],
            ...(s.truncated ? [["Context", "truncated"]] : []),
          ],
        });
      };
      return (
        <div ref={wrap} className="relative">
          <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" role="img" aria-label="Prompt tokens and cached tokens per step">
            {ticks.map((t) => (
              <g key={t}>
                <line x1={m.l} x2={W - m.r} y1={y(t)} y2={y(t)} stroke="var(--grid)" />
                <text x={m.l - 8} y={y(t)} dy="0.32em" textAnchor="end" fontSize="11" fill="var(--text-muted)" className="num">{t.toLocaleString()}</text>
              </g>
            ))}
            {steps.map((s, i) => {
              const x0 = m.l + i * band + band / 2 - bw - 1;
              const p = s.prompt_tokens || 0, c = s.cached_tokens || 0;
              return (
                <g key={i} onMouseMove={(e) => show(e, s)} onMouseLeave={() => setTip(null)}>
                  <rect x={m.l + i * band} y={m.t} width={band} height={ih} fill="transparent" />
                  <rect x={x0} y={y(p)} width={bw} height={Math.max(0, m.t + ih - y(p))} rx="3" fill="var(--series-1)" />
                  <rect x={x0 + bw + 2} y={y(c)} width={bw} height={Math.max(0, m.t + ih - y(c))} rx="3" fill="var(--series-2)" />
                  {s.truncated && <text x={x0 + bw} y={y(p) - 6} textAnchor="middle" fontSize="11" fill="var(--bad)">✂</text>}
                  <text x={m.l + i * band + band / 2} y={H - 10} textAnchor="middle" fontSize="11" fill="var(--text-muted)">{s.index}</text>
                </g>
              );
            })}
            <line x1={m.l} x2={W - m.r} y1={m.t + ih} y2={m.t + ih} stroke="var(--text-muted)" />
          </svg>
          <Tooltip tip={tip} />
        </div>
      );
    }

    /* ---------- chart: where the time goes, per run ---------- */

    function TimeBreakdown({ runs }) {
      const [tip, setTip] = useState(null);
      const wrap = useRef(null);
      const parts = [["LLM", "llm_%", "var(--series-1)"], ["Tools", "tool_%", "var(--series-2)"], ["Overhead", "overhead_%", "var(--series-3)"]];
      return (
        <div ref={wrap} className="relative space-y-2">
          {runs.map((r) => (
            <div key={r.run} className="flex items-center gap-3">
              <div className="w-28 shrink-0 text-xs secondary mono truncate" title={r.run}>{r.run}</div>
              <div className="flex-1 flex h-5 gap-[2px]"
                   onMouseMove={(e) => {
                     const b = wrap.current.getBoundingClientRect();
                     setTip({ x: e.clientX - b.left, y: e.clientY - b.top, title: `${r.run} · ${r.model || ""}`,
                              rows: parts.map(([l, k, c]) => [l, `${fmt(r[k])}%`, c]) });
                   }}
                   onMouseLeave={() => setTip(null)}>
                {parts.map(([l, k, c], i) => r[k] > 0.05 && (
                  <div key={l} style={{ width: `${r[k]}%`, background: c,
                                        borderRadius: i === 0 ? "4px 0 0 4px" : i === 2 || !(r["overhead_%"] > 0.05) && i === 1 ? "0 4px 4px 0" : 0 }} />
                ))}
              </div>
              <div className="w-12 text-right text-xs num secondary">{fmt(r["llm_%"], 0)}%</div>
            </div>
          ))}
          <Tooltip tip={tip} />
        </div>
      );
    }

    /* ---------- Week 3 charts: context growth, latency CDF, 4-part time split ---------- */

    const SERIES = ["var(--series-1)", "var(--series-2)", "var(--series-3)"];

    function LineChart({ series, xLabel, yLabel, yMax, band, stepLine, fmtY = (v) => v.toLocaleString(), fmtX = (v) => v }) {
      // series: [{name, points: [{x, y, lo?, hi?}]}]
      const [tip, setTip] = useState(null);
      const wrap = useRef(null);
      const W = 640, H = 260, m = { t: 12, r: 16, b: 38, l: 52 };
      const all = series.flatMap((s) => s.points);
      if (!all.length) return null;
      const xMin = stepLine ? 0 : Math.min(...all.map((p) => p.x)), xMax = Math.max(...all.map((p) => p.x));
      const top = yMax ?? Math.max(...all.map((p) => p.hi ?? p.y)) * 1.08;
      const iw = W - m.l - m.r, ih = H - m.t - m.b;
      const x = (v) => m.l + (xMax === xMin ? iw / 2 : ((v - xMin) / (xMax - xMin)) * iw);
      const y = (v) => m.t + ih - (v / top) * ih;
      const yt = [0, 0.25, 0.5, 0.75, 1].map((f) => top * f);
      const path = (pts) => stepLine
        ? pts.map((p, i) => (i === 0 ? `M${x(p.x)},${y(0)} V${y(p.y)}` : `H${x(p.x)} V${y(p.y)}`)).join(" ")
        : pts.map((p, i) => `${i ? "L" : "M"}${x(p.x)},${y(p.y)}`).join(" ");
      const onMove = (e) => {
        const r = wrap.current.getBoundingClientRect();
        const px = ((e.clientX - r.left) / r.width) * W;
        const rows = series.map((s, i) => {
          const near = s.points.reduce((a, p) => (Math.abs(x(p.x) - px) < Math.abs(x(a.x) - px) ? p : a), s.points[0]);
          return [s.name, `${fmtY(near.y)} @ ${fmtX(near.x)}`, SERIES[i]];
        });
        setTip({ x: e.clientX - r.left, y: e.clientY - r.top, title: xLabel, rows });
      };
      return (
        <div ref={wrap} className="relative">
          <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" onMouseMove={onMove} onMouseLeave={() => setTip(null)}>
            {yt.map((t) => (
              <g key={t}>
                <line x1={m.l} x2={W - m.r} y1={y(t)} y2={y(t)} stroke="var(--grid)" />
                <text x={m.l - 8} y={y(t)} dy="0.32em" textAnchor="end" fontSize="11" fill="var(--text-muted)">{fmtY(Math.round(t))}</text>
              </g>
            ))}
            {series.map((s, i) => band && s.points[0]?.lo !== undefined && (
              <path key={`b${i}`} fill={SERIES[i]} opacity="0.12"
                    d={`${s.points.map((p, j) => `${j ? "L" : "M"}${x(p.x)},${y(p.hi)}`).join(" ")} ${[...s.points].reverse().map((p) => `L${x(p.x)},${y(p.lo)}`).join(" ")} Z`} />
            ))}
            {series.map((s, i) => (
              <g key={i}>
                <path d={path(s.points)} fill="none" stroke={SERIES[i]} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
                {!stepLine && s.points.map((p, j) => <circle key={j} cx={x(p.x)} cy={y(p.y)} r="4" fill={SERIES[i]} stroke="var(--surface-1)" strokeWidth="2" />)}
              </g>
            ))}
            <line x1={m.l} x2={W - m.r} y1={m.t + ih} y2={m.t + ih} stroke="var(--text-muted)" />
            {(stepLine ? [0, 0.25, 0.5, 0.75, 1].map((f) => xMin + f * (xMax - xMin))
                       : [...new Set(all.map((p) => p.x))].filter((v, i, a) => a.length <= 12 || i % Math.ceil(a.length / 8) === 0)).map((v) => (
              <text key={v} x={x(v)} y={H - 20} textAnchor="middle" fontSize="11" fill="var(--text-muted)">{fmtX(v)}</text>
            ))}
            <text x={m.l + iw / 2} y={H - 4} textAnchor="middle" fontSize="11" fill="var(--text-secondary)">{xLabel}</text>
            <text x={12} y={m.t + ih / 2} textAnchor="middle" fontSize="11" fill="var(--text-secondary)" transform={`rotate(-90 12 ${m.t + ih / 2})`}>{yLabel}</text>
          </svg>
          <Tooltip tip={tip} />
        </div>
      );
    }

    function TimeSplit({ split }) {
      const parts = [["Prefill (TTFT)", "prefill (TTFT)", "var(--series-1)"], ["Decode", "decode", "var(--series-2)"],
                     ["Tools", "tools", "var(--series-3)"], ["Overhead", "overhead", "var(--series-4)"]];
      return (
        <div className="space-y-3">
          <Legend items={parts.map(([l, , c]) => [l, c])} />
          {Object.entries(split).map(([run, v]) => (
            <div key={run} className="flex items-center gap-3">
              <div className="w-24 shrink-0 text-xs secondary mono truncate">{run}</div>
              <div className="flex-1 flex h-6 gap-[2px]">
                {parts.map(([l, k, c]) => v[k] > 0.3 && (
                  <div key={k} title={`${l}: ${fmt(v[k])}%`} className="flex items-center justify-center text-[11px] text-white first:rounded-l last:rounded-r"
                       style={{ width: `${v[k]}%`, background: c }}>{v[k] >= 9 ? `${Math.round(v[k])}%` : ""}</div>
                ))}
              </div>
            </div>
          ))}
        </div>
      );
    }

    function CompareView({ rows }) {
      const cols = [["run", "Setup"], ["tasks", "Tasks"], ["accuracy", "Acc."], ["ttft_p50_s", "TTFT P50 s"], ["ttft_p95_s", "TTFT P95 s"],
                    ["task_p50_s", "Task P50 s"], ["task_p95_s", "Task P95 s"], ["tasks_per_min", "Tasks/min"],
                    ["prefill_tokens_computed", "Prefill tokens"], ["cache_hit_%", "Cache hit %"]];
      const maxT = Math.max(...rows.map((r) => r.tasks_per_min || 0), 1);
      return (
        <div className="space-y-5">
          <div className="overflow-x-auto">
            <table className="w-full text-sm num">
              <thead><tr>{cols.map(([k, l]) => <th key={k} className="text-left font-medium muted py-2 pr-4 whitespace-nowrap">{l}</th>)}</tr></thead>
              <tbody>{rows.map((r) => (
                <tr key={r.run}>{cols.map(([k]) => (
                  <td key={k} className={`py-2 pr-4 whitespace-nowrap ${k === "run" ? "mono text-xs" : ""}`}>
                    {k === "accuracy" ? `${Math.round(100 * r[k])}%` : k === "prefill_tokens_computed" && r[k] != null ? r[k].toLocaleString()
                      : typeof r[k] === "number" ? fmt(r[k], k === "tasks" ? 0 : 1) : r[k] ?? "–"}
                  </td>))}</tr>))}
              </tbody>
            </table>
          </div>
          {rows.some((r) => r.tasks_per_min) && (
            <div>
              <div className="text-sm font-medium mb-2">Throughput (tasks per minute)</div>
              <div className="space-y-2">
                {rows.map((r) => (
                  <div key={r.run} className="flex items-center gap-3">
                    <div className="w-28 shrink-0 text-xs secondary mono truncate">{r.run}</div>
                    <div className="flex-1"><div className="h-5 rounded-r" style={{ width: `${(100 * (r.tasks_per_min || 0)) / maxT}%`, background: "var(--series-1)", borderRadius: "0 4px 4px 0" }} /></div>
                    <div className="w-12 text-right text-xs num secondary">{fmt(r.tasks_per_min)}</div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ---------- Results tab ---------- */

    function RunsTable({ runs }) {
      const cols = [["run", "Run"], ["model", "Model"], ["accuracy", "Acc."], ["finished", "Done"], ["steps_mean", "Steps"],
                    ["task_s_p50", "P50 s"], ["ttft_mean_s", "TTFT s"], ["prefix_reuse_%", "Prefix % (chars)"],
                    ["cached_tok_%", "Cached %"], ["truncated_steps", "Trunc."]];
      return (
        <div className="overflow-x-auto">
          <table className="w-full text-sm num">
            <thead><tr>{cols.map(([k, l]) => <th key={k} className="text-left font-medium muted py-2 pr-4 whitespace-nowrap">{l}</th>)}</tr></thead>
            <tbody>
              {runs.map((r) => (
                <tr key={r.run}>
                  {cols.map(([k]) => (
                    <td key={k} className={`py-2 pr-4 whitespace-nowrap ${k === "run" || k === "model" ? "mono text-xs" : ""}`}
                        style={k === "truncated_steps" && r[k] > 0 ? { color: "var(--bad)" } : {}}>
                      {k === "accuracy" || k === "finished" ? `${Math.round(r[k] * 100)}%`
                        : typeof r[k] === "number" ? fmt(r[k], k === "truncated_steps" ? 0 : 1) : r[k]}
                    </td>
                  ))}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function TaskGrid({ perTask }) {
      const tasks = Object.keys(perTask);
      if (!tasks.length) return null;
      const runs = Object.keys(perTask[tasks[0]]);
      return (
        <div className="overflow-x-auto">
          <table className="text-sm">
            <thead><tr><th className="text-left font-medium muted py-2 pr-4">Task</th>
              {runs.map((r) => <th key={r} className="font-medium muted py-2 px-2 mono text-xs whitespace-nowrap">{r}</th>)}</tr></thead>
            <tbody>
              {tasks.map((t) => (
                <tr key={t}><td className="py-1.5 pr-4 mono text-xs">{t}</td>
                  {runs.map((r) => (
                    <td key={r} className="text-center py-1.5 px-2" style={{ color: perTask[t][r] ? "var(--good)" : "var(--bad)" }}
                        aria-label={perTask[t][r] ? "correct" : "wrong"}>{perTask[t][r] ? "✓" : "✗"}</td>
                  ))}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function Results() {
      const exps = DATA.experiments || [];
      const [sel, setSel] = useState(exps.length ? exps[exps.length - 1].id : null);
      const exp = exps.find((e) => e.id === sel);
      if (!exps.length) return <div className="card p-6 secondary">No results exported yet. Run <code className="mono">uv run agentic-export</code>.</div>;
      const runs = exp.runs;
      const ex = exp.example;
      const st = exp.stats ? Object.values(exp.stats) : [];
      const many = Object.keys(exp.per_task || {}).length > 20;
      return (
        <div className="space-y-6">
          <div className="flex flex-wrap gap-2">
            {exps.map((e) => (
              <button key={e.id} onClick={() => setSel(e.id)}
                      className={`px-3 py-1.5 rounded-lg text-sm border ${e.id === sel ? "tab-active font-medium" : "border-transparent secondary"}`}>
                {e.title}
              </button>
            ))}
          </div>
          {exp.description && <p className="secondary max-w-3xl">{exp.description}</p>}

          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
            <Stat label="Repeated prefix" value={fmt(st.length ? mean(st.map((v) => v["repeated_prefix_%_steps_ge1"])) : mean(runs.map((r) => r["prefix_reuse_%"])), 0)} unit="%" hint="of each prompt (steps ≥ 1)" />
            <Stat label="Served from cache" value={fmt(mean(runs.map((r) => r["cached_tok_%"])), 0)} unit="%" hint="prompt tokens" />
            {st.length
              ? <Stat label="Time in prefill" value={fmt(mean(st.map((v) => v["time_split_%"]["prefill (TTFT)"])), 0)} unit="%" hint="processing the prompt (TTFT)" />
              : <Stat label="Time in the LLM" value={fmt(mean(runs.map((r) => r["llm_%"])), 0)} unit="%" hint="vs. tools and overhead" />}
            <Stat label="Accuracy" value={fmt(100 * mean(runs.map((r) => r.accuracy)), 0)} unit="%" hint={`mean of ${runs.length} runs`} />
          </div>

          <div className="grid lg:grid-cols-2 gap-6">
            <section className="card p-5">
              <h3 className="font-semibold">Prompt grows, cache follows</h3>
              <p className="text-xs muted mt-0.5 mb-3">
                <span className="mono">{ex.run}/{ex.task_id}</span> · {ex.model} · "{ex.question}"
              </p>
              <Legend items={[["Prompt tokens", "var(--series-1)"], ["Cached tokens", "var(--series-2)"]]} />
              <div className="mt-2"><StepTokensChart steps={ex.steps} /></div>
              <p className="text-xs muted mt-1">Step number on the x-axis. ✂ = server truncated the context.</p>
            </section>
            <section className="card p-5">
              <h3 className="font-semibold">Where the time goes</h3>
              <p className="text-xs muted mt-0.5 mb-3">Share of total task time, per run</p>
              {exp.time_split ? <TimeSplit split={exp.time_split} /> : (
                <>
                  <Legend items={[["LLM", "var(--series-1)"], ["Tools", "var(--series-2)"], ["Overhead", "var(--series-3)"]]} />
                  <div className="mt-3"><TimeBreakdown runs={runs} /></div>
                </>
              )}
            </section>
          </div>

          {exp.compare && (
            <section className="card p-5">
              <h3 className="font-semibold mb-3">Serving comparison</h3>
              <CompareView rows={exp.compare} />
            </section>
          )}

          {exp.growth && (
            <div className="grid lg:grid-cols-2 gap-6">
              <section className="card p-5">
                <h3 className="font-semibold">Context grows every step</h3>
                <p className="text-xs muted mt-0.5 mb-3">Median prompt tokens per step; band = 25th-75th percentile</p>
                <Legend items={Object.keys(exp.growth).slice(0, 3).map((r, i) => [r, SERIES[i]])} />
                <LineChart band xLabel="Step" yLabel="Prompt tokens"
                           series={Object.entries(exp.growth).slice(0, 3).map(([name, pts]) => ({ name, points: pts.map((p) => ({ x: p.step, y: p.p50, lo: p.p25, hi: p.p75 })) }))} />
              </section>
              <section className="card p-5">
                <h3 className="font-semibold">Task latency CDF</h3>
                <p className="text-xs muted mt-0.5 mb-3">
                  {Object.entries(exp.latency).map(([r, xs]) => `${r}: P50 ${fmt(xs[Math.floor(0.5 * (xs.length - 1))], 0)}s, P95 ${fmt(xs[Math.floor(0.95 * (xs.length - 1))], 0)}s`).join(" · ")}
                </p>
                <Legend items={Object.keys(exp.latency).slice(0, 3).map((r, i) => [r, SERIES[i]])} />
                <LineChart stepLine yMax={100} xLabel="Task latency (s)" yLabel="% of tasks" fmtY={(v) => `${v}%`} fmtX={(v) => `${Math.round(v)}`}
                           series={Object.entries(exp.latency).slice(0, 3).map(([name, xs]) => ({ name, points: xs.map((v, i) => ({ x: v, y: Math.round((100 * (i + 1)) / xs.length) })) }))} />
              </section>
            </div>
          )}

          <section className="card p-5">
            <h3 className="font-semibold mb-3">All runs</h3>
            <RunsTable runs={runs} />
          </section>
          {!many && (
            <section className="card p-5">
              <h3 className="font-semibold mb-3">Correct answers per task</h3>
              <TaskGrid perTask={exp.per_task} />
            </section>
          )}
          <p className="text-xs muted">Exported {exp.exported}. Page data updated {DATA.updated}.</p>
        </div>
      );
    }

    /* ---------- Ask tab (only with the local API) ---------- */

    function StepCard({ s }) {
      const [open, setOpen] = useState(false);
      const thought = (s.output.match(/Thought:\s*([\s\S]*?)(?=\n\s*(Action|Final Answer):|$)/) || [])[1];
      const final = (s.output.match(/Final Answer:\s*([\s\S]*)/) || [])[1];
      const hit = s.prompt_tokens && s.cached_tokens != null ? Math.round((100 * s.cached_tokens) / s.prompt_tokens) : null;
      return (
        <div className="card p-4">
          <div className="flex flex-wrap items-center gap-x-3 gap-y-1">
            <span className="text-xs font-semibold px-2 py-0.5 rounded" style={{ background: "var(--surface-2)" }}>Step {s.index}</span>
            <span className="text-sm font-medium">{s.tool ? `${s.tool}` : final !== undefined ? "Final answer" : "—"}</span>
            <span className="ml-auto flex flex-wrap gap-3 text-xs secondary num">
              <span title="Time to first token">TTFT {fmt(s.llm_ttft_s, 2)}s</span>
              <span title="Generation time">gen {fmt(s.llm_generation_s, 2)}s</span>
              {s.tool && <span title="Tool time">tool {fmt(s.tool_s, 2)}s</span>}
              <span title="Prompt tokens">{s.prompt_tokens ?? "–"} tok</span>
              <span title="Prompt tokens served from cache">cache {hit ?? "–"}%</span>
            </span>
          </div>
          {thought && <p className="mt-2 text-sm secondary"><span className="muted">Thought: </span>{thought.trim()}</p>}
          {s.tool_input && <p className="mt-1 text-sm"><span className="muted">Input: </span><span className="mono text-xs whitespace-pre-wrap">{s.tool_input}</span></p>}
          {final !== undefined && <p className="mt-2 text-sm font-medium">{final.trim()}</p>}
          {s.observation && (
            <div className="mt-2">
              <button onClick={() => setOpen(!open)} className="text-xs" style={{ color: "var(--accent)" }}>
                {open ? "Hide" : "Show"} observation ({s.observation.length} chars)
              </button>
              {open && <pre className="mt-1 p-3 rounded-lg text-xs mono whitespace-pre-wrap" style={{ background: "var(--surface-2)" }}>{s.observation}</pre>}
            </div>
          )}
        </div>
      );
    }

    function Ask({ configs }) {
      const [question, setQuestion] = useState("How many years passed between the founding of Google and the founding of Microsoft?");
      const [config, setConfig] = useState(configs[0]?.name || "ollama");
      const [steps, setSteps] = useState([]);
      const [done, setDone] = useState(null);
      const [error, setError] = useState(null);
      const [running, setRunning] = useState(false);
      const [elapsed, setElapsed] = useState(0);
      const es = useRef(null);

      useEffect(() => {
        if (!running) return;
        const t0 = Date.now();
        const id = setInterval(() => setElapsed((Date.now() - t0) / 1000), 200);
        return () => clearInterval(id);
      }, [running]);

      const run = (e) => {
        e.preventDefault();
        if (es.current) es.current.close();
        setSteps([]); setDone(null); setError(null); setRunning(true); setElapsed(0);
        const src = new EventSource(`/api/ask?${new URLSearchParams({ question, config })}`);
        es.current = src;
        src.addEventListener("step", (ev) => setSteps((p) => [...p, JSON.parse(ev.data)]));
        src.addEventListener("done", (ev) => { setDone(JSON.parse(ev.data)); setRunning(false); src.close(); });
        src.addEventListener("error", (ev) => {
          setError(ev.data ? JSON.parse(ev.data).message : "Connection lost. Is `uv run agentic-ui` still running?");
          setRunning(false); src.close();
        });
      };

      const totals = useMemo(() => ({
        llm: steps.reduce((a, s) => a + s.llm_total_s, 0),
        tool: steps.reduce((a, s) => a + s.tool_s, 0),
        reuse: (() => {
          const later = steps.filter((s) => s.index > 0);
          const pc = later.reduce((a, s) => a + s.prompt_chars, 0);
          return pc ? (100 * later.reduce((a, s) => a + s.shared_prefix_chars, 0)) / pc : null;
        })(),
      }), [steps]);

      return (
        <div className="space-y-6">
          <form onSubmit={run} className="card p-5 space-y-3">
            <label className="block text-sm font-medium" htmlFor="q">Ask the agent a question</label>
            <textarea id="q" rows="2" value={question} onChange={(e) => setQuestion(e.target.value)}
                      className="w-full rounded-lg p-3 text-sm border" style={{ background: "var(--surface-0)", borderColor: "var(--border)" }} />
            <div className="flex flex-wrap items-center gap-3">
              <select value={config} onChange={(e) => setConfig(e.target.value)} className="rounded-lg px-3 py-2 text-sm border"
                      style={{ background: "var(--surface-0)", borderColor: "var(--border)" }}>
                {configs.map((c) => <option key={c.name} value={c.name}>{c.model}</option>)}
              </select>
              <button type="submit" disabled={running || question.trim().length < 3}
                      className="px-4 py-2 rounded-lg text-sm font-medium text-white disabled:opacity-50" style={{ background: "var(--accent)" }}>
                {running ? `Running… ${fmt(elapsed, 0)}s` : "Run agent"}
              </button>
              <span className="text-xs muted">Tools: Wikipedia search, calculator, Python. Each run is saved to <span className="mono">traces/ask/</span>.</span>
            </div>
          </form>

          {error && <div className="card p-4 text-sm" style={{ color: "var(--bad)" }}>⚠ {error}</div>}

          {done && (
            <div className="card p-5">
              <div className="text-xs uppercase tracking-wide muted">Answer · {done.model}</div>
              <div className="mt-1 text-2xl font-semibold">{done.answer ?? "No answer (step limit reached)"}</div>
              <div className="mt-3 grid grid-cols-2 sm:grid-cols-5 gap-3 text-sm num">
                <div><div className="muted text-xs">Total</div>{fmt(done.total_s)} s</div>
                <div><div className="muted text-xs">Steps</div>{steps.length}</div>
                <div><div className="muted text-xs">LLM time</div>{fmt(totals.llm)} s</div>
                <div><div className="muted text-xs">Tool time</div>{fmt(totals.tool)} s</div>
                <div><div className="muted text-xs">Repeated prefix</div>{fmt(totals.reuse, 0)}%</div>
              </div>
              <div className="mt-2 text-xs muted">Saved to <span className="mono">{done.saved_to}</span></div>
            </div>
          )}

          {steps.length > 0 && (
            <section className="card p-5">
              <h3 className="font-semibold">Prompt grows, cache follows</h3>
              <div className="mt-2"><Legend items={[["Prompt tokens", "var(--series-1)"], ["Cached tokens", "var(--series-2)"]]} /></div>
              <div className="mt-2"><StepTokensChart steps={steps} /></div>
            </section>
          )}

          <div className="space-y-3">
            {steps.map((s) => <StepCard key={s.index} s={s} />)}
            {running && <div className="card p-4 text-sm muted animate-pulse">Step {steps.length}: the model is thinking…</div>}
          </div>
        </div>
      );
    }

    /* ---------- About tab ---------- */

    function About() {
      return (
        <div className="card p-6 space-y-4 max-w-3xl leading-relaxed">
          <h3 className="font-semibold text-lg">What this project measures</h3>
          <p className="secondary">
            A ReAct agent answers a question in steps: it thinks, calls a tool (Wikipedia search, calculator or Python),
            reads the result, and repeats. The model has no memory between steps, so every call re-sends the whole
            conversation so far. Most of each prompt is therefore text the model has already processed.
          </p>
          <p className="secondary">
            This project records, for every step, the time to first token, generation time, tool time, prompt and output
            tokens, and how much of the prompt is a repeated prefix. The traces are used to measure how much serving
            optimizations such as prefix caching (vLLM) and RadixAttention (SGLang) help, for one agent and for many
            concurrent agents.
          </p>
          <h3 className="font-semibold text-lg">Run it yourself</h3>
          <pre className="p-4 rounded-lg text-xs mono overflow-x-auto" style={{ background: "var(--surface-2)" }}>{`git clone https://github.com/Carlos28042003/agent-profilling.git
cd agent-profilling
uv sync
ollama pull llama3.2:3b
ollama create llama3.2:3b-ctx8k -f configs/ollama/llama3.2-ctx8k.Modelfile
uv run agentic-ui        # this page + the live "Ask" tab`}</pre>
        </div>
      );
    }

    /* ---------- App ---------- */

    function App() {
      const [api, setApi] = useState(null); // null = checking, false = static page, object = local API
      const [tab, setTab] = useState("results");
      useEffect(() => {
        fetch("/api/health").then((r) => (r.ok ? r.json() : false)).then(setApi).catch(() => setApi(false));
      }, []);
      const tabs = [["results", "Results"], ["ask", "Ask the agent"], ["about", "About"]];
      return (
        <div className="max-w-6xl mx-auto px-4 py-8">
          <header className="mb-6">
            <h1 className="text-2xl sm:text-3xl font-semibold tracking-tight">Agentic Profiling</h1>
            <p className="secondary mt-1 max-w-3xl">
              Where does the time go when an LLM agent runs, and how much of its work is repeated?
            </p>
            <div className="mt-2 text-xs muted">
              Carlos Chirindza · <a className="underline" href="https://github.com/Carlos28042003/agent-profilling">GitHub repository</a>
            </div>
          </header>
          <nav className="flex gap-1 mb-6 border-b" style={{ borderColor: "var(--border)" }}>
            {tabs.map(([k, l]) => (
              <button key={k} onClick={() => setTab(k)}
                      className={`px-4 py-2 text-sm rounded-t-lg border border-b-0 -mb-px ${tab === k ? "tab-active font-medium" : "border-transparent secondary"}`}>
                {l}{k === "ask" && api === false ? " (local only)" : ""}
              </button>
            ))}
          </nav>
          {tab === "results" && <Results />}
          {tab === "about" && <About />}
          {tab === "ask" && (api ? <Ask configs={api.configs} /> : (
            <div className="card p-6 secondary space-y-2">
              <p>{api === null ? "Checking for the local agent server…" : "The live agent runs on your own machine (it needs Ollama and the Python backend)."}</p>
              {api === false && <p>Start it with <code className="mono">uv run agentic-ui</code> and open <code className="mono">http://localhost:8000</code>.</p>}
            </div>
          ))}
        </div>
      );
    }

    const theme = new URLSearchParams(location.search).get("theme");  // ?theme=light|dark forces a theme
    if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
